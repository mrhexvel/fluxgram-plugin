[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxgram-sdk"
version = "2.6.0"
description = "Public Python SDK for FluxGram plugins"
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/mrhexvel/fluxgram-sdk"
Issues = "https://github.com/mrhexvel/fluxgram-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluxgram = ["py.typed"]
