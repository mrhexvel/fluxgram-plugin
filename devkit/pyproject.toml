[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxgram-plugin-devkit"
version = "1.1.0"
description = "Build and validate FluxGram plugin packages"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"

[project.scripts]
fluxgram-plugin = "fluxgram_devkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluxgram_devkit = [
    "artifacts/*",
    "templates/python-java/*",
    "templates/python-java/plugin/*",
    "templates/python-java/java/src/example/plugin/*",
]
